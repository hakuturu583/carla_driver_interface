name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The whole of `requires-python`.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        # `--locked` fails if uv.lock is stale rather than rewriting it.
        # grpcio-tools (proto regeneration) is only installed on 3.10-3.12,
        # so the generated-modules freshness test is skipped on 3.13+.
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync mypy src tests scripts

      - name: Test
        run: uv run --no-sync pytest -q

      - name: Generated protobuf modules are current
        if: matrix.python-version == '3.12'
        run: uv run --no-sync python scripts/compile_protos.py --check

      - name: Closed-loop smoke test
        # Exercises the CLI wiring that `pytest` does not: two real processes
        # talking over a real socket.
        run: |
          set -euo pipefail

          uv run --no-sync carla-driver-interface serve --policy route_follower --port 50251 &
          server=$!
          # The runner kills leftover background processes at job teardown and
          # attributes their exit status to this step, so the server has to be
          # reaped here rather than left running.
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT

          # Poll the port rather than sleeping a fixed amount.
          for _ in $(seq 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/50251) 2>/dev/null; then
              break
            fi
            sleep 0.5
          done

          uv run --no-sync carla-driver-interface demo --driver localhost:50251 --steps 200

      - name: Driver image smoke test
        # `alpasim build-image` from this checkout, then the fake loop against the
        # container, in alpasim mode as the image serves by default.
        if: matrix.python-version == '3.12'
        run: |
          set -euo pipefail

          uv run --no-sync carla-driver-interface alpasim build-image \
            --tag carla-driver-interface-driver:ci --carla-driver-interface . \
            --context-dir "$RUNNER_TEMP/driver-image"
          docker run -d --rm --name driver -p 50252:50051 carla-driver-interface-driver:ci
          trap 'docker logs driver || true; docker stop driver >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/50252) 2>/dev/null; then
              break
            fi
            sleep 0.5
          done

          uv run --no-sync carla-driver-interface demo --driver localhost:50252 --steps 100
