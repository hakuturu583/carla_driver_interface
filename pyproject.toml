[project]
name = "carla-driver-interface"
version = "1.0.0"
description = "Both ends of alpasim's egodriver gRPC contract: serve a driving policy, or drive one without CARLA"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Masaya Kataoka", email = "ms.kataoka@gmail.com" }
]
# Autoware's own environment is 3.10, which alpasim's published
# `alpasim-grpc` excludes -- hence the vendored protos.
requires-python = ">=3.10,<3.15"
# Deliberately light, so a policy can depend on it without the scenario
# framework: the wire format (grpcio, and protobuf from the 4.25 the generated
# modules were built with), arrays, rotations, and image decoding.
dependencies = [
    "grpcio>=1.60",
    # 4.25 gencode, which every runtime from 4.25 through 7.x loads; the 4.x
    # runtime cannot load on Python 3.14.
    "protobuf>=4.25.0,<8",
    "numpy>=1.21",
    # Rotations (Rotation, Slerp) for the geometry module.
    "scipy>=1.8",
    "pillow>=10.0",
]

[project.scripts]
carla-driver-interface = "carla_driver_interface.cli:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Regenerates the committed protobuf modules (scripts/compile_protos.py); must
    # stay on the protobuf 4.x line so the generated code matches the 4.25 gencode
    # the runtime floor loads. That line has no wheels for 3.13+ and no longer
    # builds there, so regenerate on 3.10-3.12; the runtime never needs it.
    "grpcio-tools>=1.60,<1.63; python_version < '3.13'",
    # grpcio-tools holds protobuf to 4.x on 3.10-3.12, and a universal lock would
    # otherwise carry that 4.25 to 3.13+ too, where the 4.x runtime cannot load on
    # 3.14. Forking here tests the floor (4.25) on 3.10-3.12 and the current
    # runtime on 3.13+.
    "protobuf>=5; python_version >= '3.13'",
    "pytest>=8",
    "ruff>=0.7",
    "mypy>=1.11",
    # Reads back the wizard config `alpasim wizard-config` writes.
    "pyyaml>=6",
    "types-pyyaml",
]

[tool.ruff]
# Generated protobuf modules are verbatim protoc output (proto/README.md).
extend-exclude = ["**/_proto"]

[tool.ruff.lint]
# Spelled out rather than left to ruff's default, which grows between releases.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
exclude = [".*/_proto/"]

[[tool.mypy.overrides]]
# Generated protobuf modules carry no useful annotations of their own.
module = ["carla_driver_interface._proto.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
